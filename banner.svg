<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="interpersonal dynamics analysis banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1a1d24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#4ec9a8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- 关系网络装饰 -->
  <g stroke="#2c313c" stroke-width="2" fill="none">
    <line x1="120" y1="500" x2="360" y2="180"/>
    <line x1="360" y1="180" x2="700" y2="420"/>
    <line x1="700" y1="420" x2="1040" y2="200"/>
    <line x1="120" y1="500" x2="700" y2="420"/>
    <line x1="360" y1="180" x2="1040" y2="200"/>
    <line x1="700" y1="420" x2="1160" y2="500"/>
  </g>
  <g fill="#6ea8fe" opacity="0.9">
    <circle cx="120" cy="500" r="10"/>
    <circle cx="360" cy="180" r="14" fill="#4ec9a8"/>
    <circle cx="700" cy="420" r="12"/>
    <circle cx="1040" cy="200" r="10"/>
    <circle cx="1160" cy="500" r="8" fill="#ffd166"/>
  </g>
  <!-- 对话气泡装饰 -->
  <g fill="#21252e" stroke="url(#accent)" stroke-width="2">
    <rect x="900" y="360" width="180" height="90" rx="16"/>
    <rect x="840" y="300" width="150" height="60" rx="14" opacity="0.7"/>
  </g>
  <g fill="#6ea8fe">
    <circle cx="935" cy="395" r="6"/>
    <circle cx="970" cy="395" r="6"/>
    <circle cx="1005" cy="395" r="6"/>
  </g>
  <!-- 标题 -->
  <text x="120" y="300" fill="#e6e6e6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700">人际动力学分析</text>
  <text x="122" y="350" fill="#9aa3b2" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26">Interpersonal Dynamics Analysis</text>
  <text x="122" y="395" fill="#6ea8fe" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">对话 / 场景 · 心理与人格结构化分析</text>
  <rect x="122" y="430" width="420" height="4" rx="2" fill="url(#accent)"/>
</svg>
